services:
  # ── Backend API ────────────────────────────────────────────────────────────
  - type: web
    name: my-levelup-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build && npx prisma generate
    startCommand: node dist/server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false   # à saisir dans le dashboard Render
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: meta-llama/llama-3.3-70b-instruct:free
      - key: FRONTEND_URL
        sync: false   # ex: https://my-levelup.onrender.com

  # ── Frontend SPA ───────────────────────────────────────────────────────────
  - type: web
    name: my-levelup
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false   # ex: https://my-levelup-api.onrender.com/api
